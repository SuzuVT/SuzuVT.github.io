<!DOCTYPE html>

</head>

<body class="linktree-mode">

<header>
    <div id="header-particles"></div>
    <div class="header-content">
        <img src="../rsc/Suzu Kurai Logo.png" alt="Suzu Kurai Logo" class="header-logo">
    </div>
</header>

<nav class="topnav">
        <a href="/" class="topnav-link">Inicio</a>
        <a href="/lore" class="topnav-link">Lore</a>
        <a href="/perfil" class="topnav-link">Perfil</a>
        <a href="/comandos" class="topnav-link">Comandos</a>
        <a href="/redes" class="topnav-link active">Redes</a>
    </nav>

    <div class="linktree-container">
        <div class="hero-content">
            <div class="page-hero">
                <div class="page-ornament left">✦ ✦ ✦</div>
                <h1 class="page-title">Mis Redes</h1>
                <div class="page-subtitle">Rincones digitales</div>
                <div class="page-ornament right">✦ ✦ ✦</div>
            </div>
            <p style="color: var(--text-muted); margin-top: 10px;">¡Sígueme en mis rincones digitales!</p>
        </div>

        <div class="link-list">
            <a href="/redes/twitch" target="_blank" class="link-item">
                <img src="../rsc/twitch-icon.png" alt="" class="link-icon">
                <span>TWITCH</span>
            </a>

            <a href="/redes/discord" target="_blank" class="link-item">
                <img src="../rsc/discord-icon.png" alt="" class="link-icon">
                <span>DISCORD</span>
            </a>

            <a href="/redes/youtube" target="_blank" class="link-item">
                <img src="../rsc/youtube-icon.png" alt="" class="link-icon">
                <span>YOUTUBE</span>
            </a>

            <a href="/redes/tiktok" target="_blank" class="link-item">
                <img src="../rsc/tiktok-icon.png" alt="" class="link-icon">
                <span>TIKTOK</span>
            </a>

            <a href="/redes/twitter" target="_blank" class="link-item">
                <img src="../rsc/twitter-icon.png" alt="" class="link-icon">
                <span>TWITTER / X</span>
            </a>

            <a href="/redes/kofi" target="_blank" class="link-item">
                <img src="../rsc/kofi-icon.png" alt="" class="link-icon">
                <span>KOFI</span>
            </a>

            <a href="/redes/whatsapp" target="_blank" class="link-item">
                <img src="../rsc/whatsapp-icon.png" alt="" class="link-icon">
                <span>WHATSAPP</span>
            </a>

            <a href="mailto:suzukurai@gmail.com" target="_blank" class="link-item email">
                <svg class="link-icon" viewBox="0 0 48 48" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4caf50" d="M45,16.2l-5,2.75l-5,4.75L35,40h7c1.657,0,3-1.343,3-3V16.2z"/>
                    <path fill="#1e88e5" d="M3,16.2l3.614,1.71L13,23.7V40H6c-1.657,0-3-1.343-3-3V16.2z"/>
                    <path fill="#e53935" d="M35,11.2L24,19.45L13,11.2l-1,5.7l5,4.5l7,5.7l7-5.7l5-4.5L35,11.2z"/>
                    <path fill="#c62828" d="M3,12.298V16.2l10,7.5V11.2l3.124-2.341C9.132,8.301,8.228,8,7.298,8h-1.92C3.421,8,3,8.421,3,12.298z"/>
                    <path fill="#fbc02d" d="M45,12.298V16.2l-10,7.5V11.2l3.124-2.341C38.868,8.301,39.772,8,40.702,8h1.92C44.579,8,45,8.421,45,12.298z"/>
                </svg>
                <span>GMAIL</span>
            </a>

            <a href="../" target="_blank" class="link-item">
                <img src="../rsc/Suzu Kurai Logo.png" alt="" class="link-icon">
                <span>PÁGINA WEB</span>
            </a>
        </div>

    </div>
    
    <script>
        function createParticles() {
            const container = document.getElementById("header-particles");
            for (let i = 0; i < 40; i++) {
                const p = document.createElement("div");
                p.classList.add("particle");
                p.style.left = Math.random() * 100 + "%";
                p.style.top = Math.random() * 100 + "%";
                const size = Math.random() * 3 + 1 + "px";
                p.style.width = size; p.style.height = size;
                p.style.animationDuration = Math.random() * 10 + 5 + "s";
                container.appendChild(p);
            }
        }
        createParticles();
    </script>
    <script src="/js/starfield.js"></script>
</body>
</html>
